name: Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Build
      run: cargo build --verbose --release --target ${{ matrix.target }}

    - name: Run tests
      run: cargo test --verbose --release --target ${{ matrix.target }}

    - name: Package
      shell: bash
      run: |
        # 打包可执行文件, 按目标平台命名
        mkdir -p dist
        if [ "${{ runner.os }}" = "Windows" ]; then
          cp target/${{ matrix.target }}/release/openagents.exe dist/
        else
          cp target/${{ matrix.target }}/release/openagents dist/
        fi
        cd dist && zip ../openagents-${{ matrix.target }}.zip *

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: openagents-${{ matrix.target }}.zip
