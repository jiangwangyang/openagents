[package]
name = "openagents"
version = "0.1.0"
edition = "2021"
description = "Agents work for you."
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17.0"
dashmap = "6"
eventsource-stream = "0.2"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "system-proxy"] }
rmcp = { version = "3", features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["devtools"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }

[build-dependencies]
tauri-build = "2"
